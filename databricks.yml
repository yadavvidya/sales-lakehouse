bundle:
  name: sales-lakehouse

include:
  - resources/**/*.yml

sync:
  include:
    - src/**/*.py
  exclude:
    - tests/**

targets:
  dev:
    mode: development
    workspace:
      profile: dev
    variables:
      catalog_name: sales
      schema_name: sales_dev
      
  qa:
    mode: development
    workspace:
      profile: QA
    variables:
      catalog_name: sales
      schema_name: sales_qa

  prod:
    mode: production
    workspace:
      profile: prod
    variables:
      catalog_name: sales
      schema_name: sales_prod
